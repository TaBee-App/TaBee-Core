spring.application.name=tabee-backend
server.port=8080

spring.servlet.multipart.max-file-size=${MAX_AUDIO_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_UPLOAD_SIZE:100MB}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tabee}
spring.datasource.username=${DATABASE_USERNAME:tabee}
spring.datasource.password=${DATABASE_PASSWORD:tabee}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO

tabee.upload-dir=${TABEE_UPLOAD_DIR:uploads}
tabee.audio-processing.base-url=${AUDIO_PROCESSING_BASE_URL:}
tabee.core-root=${TABEE_CORE_ROOT:..}
tabee.python-command=${TABEE_PYTHON_COMMAND:python}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
