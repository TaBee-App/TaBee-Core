spring.application.name=tabee-backend
server.port=8080

spring.servlet.multipart.max-file-size=${MAX_AUDIO_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_UPLOAD_SIZE:100MB}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tabee}
spring.datasource.username=${DATABASE_USERNAME:tabee}
spring.datasource.password=${DATABASE_PASSWORD:tabee}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO

tabee.core-root=${TABEE_CORE_ROOT:..}
tabee.python-command=${TABEE_PYTHON_COMMAND:python}
tabee.processing-timeout-minutes=${TABEE_PROCESSING_TIMEOUT_MINUTES:10}
tabee.media-dir=${TABEE_MEDIA_DIR:media}
tabee.email.dev-mode=${TABEE_EMAIL_DEV_MODE:true}
tabee.email.from=${TABEE_EMAIL_FROM:noreply@tabee.local}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
